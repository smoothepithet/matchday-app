services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-matchday}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      AUTHENTICATOR_PASSWORD: ${AUTHENTICATOR_PASSWORD}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./init/00-roles.sh:/docker-entrypoint-initdb.d/00-roles.sh:ro
      - ../schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    networks:
      - matchday

  postgrest:
    image: postgrest/postgrest:v16.2
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      PGRST_DB_URI: postgres://authenticator:${AUTHENTICATOR_PASSWORD}@postgres:5432/${POSTGRES_DB:-matchday}
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_JWT_AUD: authenticated
    networks:
      - matchday
      - traefik
    labels:
      - traefik.enable=true
      - traefik.docker.network=${TRAEFIK_NETWORK}
      - traefik.http.routers.matchday-rest.rule=Host(`${APP_HOSTNAME}`) && PathPrefix(`/rest/v1`)
      - traefik.http.routers.matchday-rest.entrypoints=websecure
      - traefik.http.routers.matchday-rest.tls.certresolver=${TRAEFIK_CERTRESOLVER}
      - traefik.http.middlewares.matchday-rest-strip.stripprefix.prefixes=/rest/v1
      - traefik.http.middlewares.matchday-rest-cors.headers.accessControlAllowOriginList=*
      - traefik.http.middlewares.matchday-rest-cors.headers.accessControlAllowMethods=GET,POST,PATCH,DELETE,OPTIONS
      - traefik.http.middlewares.matchday-rest-cors.headers.accessControlAllowHeaders=*
      - traefik.http.middlewares.matchday-rest-cors.headers.accessControlMaxAge=86400
      - traefik.http.middlewares.matchday-rest-cors.headers.addVaryHeader=true
      - traefik.http.middlewares.matchday-rest-pna.headers.customResponseHeaders.Access-Control-Allow-Private-Network=true
      - traefik.http.routers.matchday-rest.middlewares=matchday-rest-pna,matchday-rest-cors,matchday-rest-strip
      - traefik.http.services.matchday-rest.loadbalancer.server.port=3000

  gotrue:
    image: supabase/gotrue:v2.196.0
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      GOTRUE_DB_DRIVER: postgres
      # search_path=auth is required: GoTrue's migration files fully
      # qualify table names (auth.users, auth.identities, ...) so schema
      # creation works fine without it, but its runtime ORM queries use
      # unqualified names ("identities", not "auth.identities") and rely
      # on the connection's default search_path to resolve them - without
      # this, every runtime query 42P01s ("relation does not exist") even
      # though the table is right there in the auth schema.
      GOTRUE_DB_DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-matchday}?options=-c%20search_path%3Dauth
      GOTRUE_SITE_URL: https://${APP_HOSTNAME}
      GOTRUE_DISABLE_SIGNUP: "true"
      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_EXP: "3600"
      GOTRUE_MAILER_AUTOCONFIRM: "true"
      API_EXTERNAL_URL: https://${APP_HOSTNAME}/auth/v1
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: "9999"
    networks:
      - matchday
      - traefik
    labels:
      - traefik.enable=true
      - traefik.docker.network=${TRAEFIK_NETWORK}
      - traefik.http.routers.matchday-auth.rule=Host(`${APP_HOSTNAME}`) && PathPrefix(`/auth/v1`)
      - traefik.http.routers.matchday-auth.entrypoints=websecure
      - traefik.http.routers.matchday-auth.tls.certresolver=${TRAEFIK_CERTRESOLVER}
      - traefik.http.middlewares.matchday-auth-strip.stripprefix.prefixes=/auth/v1
      - traefik.http.middlewares.matchday-auth-cors.headers.accessControlAllowOriginList=*
      - traefik.http.middlewares.matchday-auth-cors.headers.accessControlAllowMethods=GET,POST,PATCH,DELETE,OPTIONS
      - traefik.http.middlewares.matchday-auth-cors.headers.accessControlAllowHeaders=*
      - traefik.http.middlewares.matchday-auth-cors.headers.accessControlMaxAge=86400
      - traefik.http.middlewares.matchday-auth-cors.headers.addVaryHeader=true
      - traefik.http.middlewares.matchday-auth-pna.headers.customResponseHeaders.Access-Control-Allow-Private-Network=true
      - traefik.http.routers.matchday-auth.middlewares=matchday-auth-pna,matchday-auth-cors,matchday-auth-strip
      - traefik.http.services.matchday-auth.loadbalancer.server.port=9999

  pgbackups:
    image: prodrigestivill/postgres-backup-local:16-alpine
    restart: unless-stopped
    depends_on:
      - postgres
    volumes:
      - ${BACKUP_DIR:-./backups}:/backups
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-matchday}
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      SCHEDULE: "@daily"
      BACKUP_ON_START: "TRUE"
      # A season's worth of data here is tiny (KB-scale), so retention
      # is generous rather than tuned for disk space - the point is
      # never losing a season, not saving bytes.
      BACKUP_KEEP_DAYS: "30"
      BACKUP_KEEP_WEEKS: "12"
      BACKUP_KEEP_MONTHS: "24"
    networks:
      - matchday

networks:
  matchday:
    driver: bridge
  traefik:
    external: true
    name: ${TRAEFIK_NETWORK}
